name: release

# A release is cut only when the maintainer starts this workflow. semantic-release computes the version from the
# Conventional Commits since the last v* tag; nothing is published unless both Linux builds pass.
on:
  workflow_dispatch:

permissions:
  contents: write

# Two runs would compute the same version and publish it twice.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SEMANTIC_RELEASE: >-
    npx --yes
    -p semantic-release@25.0.9
    -p @semantic-release/exec@7.1.0
    -p conventional-changelog-conventionalcommits@9.3.1
    semantic-release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: next
        run: $SEMANTIC_RELEASE --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew check cliBuild jpackageTest jpackageArchive -PreleaseVersion=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.runner }}
          path: cli/build/distributions/the-cook-*-linux-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Fill the wrapper
        run: |
          x64=$(cut -d ' ' -f 1 "dist/the-cook-$VERSION-linux-x64.tar.gz.sha256")
          arm64=$(cut -d ' ' -f 1 "dist/the-cook-$VERSION-linux-arm64.tar.gz.sha256")
          sed -e "s|@VERSION@|$VERSION|g" \
            -e "s|@BASE_URL@|https://github.com/lmarqs/the-cook/releases/download/v$VERSION|g" \
            -e "s|@SHA256_LINUX_X64@|$x64|g" \
            -e "s|@SHA256_LINUX_ARM64@|$arm64|g" \
            cli/src/wrapper/cook > dist/cook
          chmod +x dist/cook
          (cd dist && sha256sum cook > cook.sha256)
      - name: Bundle for Maven Central
        run: ./gradlew centralBundle "-PreleaseVersion=$VERSION"
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      # semantic-release tags nothing once main has moved past the commit it was started on, and Central cannot take a
      # release back, so the bundle goes up only while main still points at this commit.
      - name: Check that main has not moved
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f 1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "main moved to $main after the release started at $GITHUB_SHA; start release again" >&2
            exit 1
          fi
      # The GitHub release follows only once Central has validated the bundle, so a refused bundle tags nothing.
      - name: Publish to Maven Central
        run: |
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)"
          deployment=$(curl --fail-with-body -sS -X POST -H "$auth" \
            -F bundle=@build/central/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=the-cook-$VERSION&publishingType=AUTOMATIC")
          for _ in $(seq 90); do
            state=$(curl --fail-with-body -sS -X POST -H "$auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment" | jq -r .deploymentState)
            echo "Deployment $deployment is $state"
            case "$state" in
              PUBLISHING | PUBLISHED) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment $deployment was not validated in 15 minutes" >&2
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      - name: Release on GitHub
        run: $SEMANTIC_RELEASE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
