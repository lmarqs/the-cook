name: release

# A release is cut only when the maintainer asks for one: by pushing to main a commit whose message holds #release, or by
# starting this workflow. semantic-release computes the version from the Conventional Commits since the last v* tag;
# nothing is published unless the Linux and macOS builds pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two runs would compute the same version and publish it twice.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SEMANTIC_RELEASE: >-
    npx --yes
    -p semantic-release@25.0.9
    -p @semantic-release/exec@7.1.0
    -p conventional-changelog-conventionalcommits@9.3.1
    semantic-release

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '#release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: next
        run: $SEMANTIC_RELEASE --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew check cliBuild jpackageTest jpackageArchive -PreleaseVersion=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.runner }}
          path: cli/build/distributions/the-cook-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build the cookbook release assets
        run: |
          ./gradlew -p cookbook releaseAssets "-PreleaseVersion=$VERSION"
          cp cookbook/build/release-assets/* dist/
      # A kitchen lists versions from the latest release, so each release carries a listing of every release that has
      # the artifact's jar, plus this one, which does not exist on GitHub yet.
      - name: List the released versions of each cookbook artifact
        run: |
          set -o pipefail
          [ -n "$VERSION" ] || { echo "::error::VERSION is empty"; exit 1; }
          assets=$(mktemp)
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName -q '.[].tagName' | while read -r tag; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sed "s/^/${tag#v} /"
          done >"$assets"
          updated=$(date -u +%Y%m%d%H%M%S)
          for artifact in agents beads docs git hello ralph; do
            versions=$({ awk -v artifact="$artifact" '$2 == artifact "-" $1 ".jar" { print $1 }' "$assets"; echo "$VERSION"; } | sort -uV)
            latest=$(printf '%s\n' "$versions" | tail -n 1)
            {
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<metadata>\n'
              printf '  <groupId>io.github.lmarqs.cookbook</groupId>\n  <artifactId>%s</artifactId>\n' "$artifact"
              printf '  <versioning>\n    <latest>%s</latest>\n    <release>%s</release>\n    <versions>\n' "$latest" "$latest"
              printf '      <version>%s</version>\n' $versions
              printf '    </versions>\n    <lastUpdated>%s</lastUpdated>\n  </versioning>\n</metadata>\n' "$updated"
            } >"dist/$artifact-maven-metadata.xml"
          done
          for artifact in agents beads docs git hello ralph; do
            grep -q '<version>[^<]' "dist/$artifact-maven-metadata.xml" || { echo "::error::No versions listed for $artifact"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ github.token }}
      # semantic-release tags nothing once main has moved past the commit the run started on, and exits without an error.
      # The Homebrew formula and the site would then point at a release that does not exist.
      - name: Check that main has not moved
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f 1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "main moved to $main after the release started at $GITHUB_SHA; start release again" >&2
            exit 1
          fi
      - name: Release on GitHub
        run: $SEMANTIC_RELEASE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Homebrew installs from Formula/cook.rb on main, so the formula follows each release.
      - name: Update the Homebrew formula
        run: |
          for platform in linux-x64 linux-arm64 macos-arm64; do
            sha=$(cut -d ' ' -f 1 "dist/the-cook-$VERSION-$platform.tar.gz.sha256")
            sed -i "/-$platform\.tar\.gz\"/{n;s/sha256 \"[0-9a-f]*\"/sha256 \"$sha\"/;}" Formula/cook.rb
          done
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/" Formula/cook.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): Homebrew installs cook $VERSION" Formula/cook.rb
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  # The site follows the release it documents, so it is published only once the release exists.
  pages:
    needs: [version, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: v${{ needs.version.outputs.version }}
