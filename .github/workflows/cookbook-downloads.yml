name: cookbook downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach cookbook downloads to
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle and attach the released cookbook
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gh release view "$TAG"
          version="${TAG#v}"
          ./gradlew centralBundle "-PreleaseVersion=$version"
          mkdir downloads
          cp cookbook/build/central-bundle/central-bundle.zip "downloads/cookbook-$version.zip"
          find cookbook/build/central -type f ! -name 'maven-metadata.xml*' -exec cp {} downloads/ \;
          gh release upload "$TAG" downloads/*
