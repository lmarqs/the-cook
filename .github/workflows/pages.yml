name: pages

# The site shows the docs of one release, so a reader never sees what main has and the release lacks. The release
# workflow calls this one with the tag it just made; a manual run publishes the tag it names, or the latest release.
# A manual run may build a later commit of that release's line through `ref`, so a docs-only change reaches the site
# without cutting a release; the version on the site stays the tag's.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v6.1.0; empty publishes the latest release
        type: string
        required: false
      ref:
        description: A commit after the tag to build instead, such as main; it must descend from the tag
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::$TAG is not a release tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', steps.tag.outputs.tag) }}
          fetch-depth: ${{ inputs.ref && '0' || '1' }}
      # A ref before the tag, or on another line, would show docs the release does not match.
      - if: inputs.ref
        run: git merge-base --is-ancestor "refs/tags/$TAG" HEAD || { echo "::error::$REF does not descend from $TAG"; exit 1; }
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REF: ${{ inputs.ref }}
      # A tag older than site/ builds with Jekyll's defaults.
      - run: |
          if [ -x site/prepare ]; then
            site/prepare "$TAG"
          fi
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      # The site also serves the cookbook artifacts of every release as a Maven repository at /maven/. Each deploy
      # replaces the whole site, so the tree is laid out again from the cookbook-<version>.zip of each release that has
      # one, the same Central bundle, with a maven-metadata.xml per artifact for listing releases. Jekyll copies it as
      # it is, since the files have no front matter.
      - name: Lay out the Maven repository
        run: |
          mkdir -p maven "$RUNNER_TEMP/bundles"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | while read -r tag; do
            bundle="cookbook-${tag#v}.zip"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$bundle"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$bundle" --dir "$RUNNER_TEMP/bundles"
              unzip -q -o "$RUNNER_TEMP/bundles/$bundle" -d maven
            fi
          done
          updated=$(date -u +%Y%m%d%H%M%S)
          find maven -name '*.pom' -exec dirname {} \; | xargs -r -n 1 dirname | sort -u | while read -r dir; do
            versions=$(find "$dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V)
            latest=$(printf '%s\n' "$versions" | tail -n 1)
            group=$(dirname "${dir#maven/}" | tr / .)
            {
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<metadata>\n'
              printf '  <groupId>%s</groupId>\n  <artifactId>%s</artifactId>\n' "$group" "$(basename "$dir")"
              printf '  <versioning>\n    <latest>%s</latest>\n    <release>%s</release>\n    <versions>\n' "$latest" "$latest"
              printf '      <version>%s</version>\n' $versions
              printf '    </versions>\n    <lastUpdated>%s</lastUpdated>\n  </versioning>\n</metadata>\n' "$updated"
            } >"$dir/maven-metadata.xml"
            md5sum "$dir/maven-metadata.xml" | cut -d ' ' -f 1 >"$dir/maven-metadata.xml.md5"
            sha1sum "$dir/maven-metadata.xml" | cut -d ' ' -f 1 >"$dir/maven-metadata.xml.sha1"
          done
          test -n "$(find maven -name maven-metadata.xml)" || { echo '::error::No release carries a cookbook bundle'; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
