<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="the-cook home">
      {% include hat.svg %}
      <span class="brand-name">THE COOK</span>
    </a>
    <a class="release" href="{{ site.source_url }}/releases/{% if site.release %}tag/{{ site.release }}{% else %}latest{% endif %}" title="The release these docs describe">{{ site.release | default: "unreleased" }}</a>
    <nav class="topnav" aria-label="Site">
      <a href="{{ '/README.html' | relative_url }}"{% if section_name == "docs" %} aria-current="true"{% endif %}>Docs</a>
      <a href="{{ '/cookbook/' | relative_url }}"{% if section_name == "cookbook" %} aria-current="true"{% endif %}>Cookbook</a>
      <a href="{{ site.source_url }}">GitHub</a>
    </nav>
  </div>
  <div class="hazard" aria-hidden="true"></div>
</header>
