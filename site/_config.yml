# The Pages site. Jekyll renders the repository's Markdown from the root, so links between the README, docs/ and the
# cookbook resolve on the site; .github/workflows/pages.yml runs site/prepare on one release's checkout, which copies
# this file to the root with release set to its tag, and builds. The layouts, includes, data, assets and landing
# page live beside it in site/.
title: the-cook
description: Recipe driven configuration for repositories worked by people and coding agents.
url: https://lmarqs.github.io
baseurl: /the-cook
repository: lmarqs/the-cook
source_url: https://github.com/lmarqs/the-cook
release:
google_analytics: G-4D40875MH6

plugins:
  - jekyll-sitemap

layouts_dir: site/_layouts
includes_dir: site/_includes
data_dir: site/_data

# Source, build and agent files are not documentation; a link to one opens it on GitHub at the release.
exclude:
  - AGENTS.md
  - tasks
  - gradle
  - gradlew
  - gradlew.bat
  - build.gradle
  - settings.gradle
  - mise.toml
  - cook.toml
  - cook.lock
  - cli/src
  - core/src
  - infra/src
  - cookbook/test
  - cookbook/src/agents/skills/agents-layout/templates
  - cookbook/src/git/templates
  - site/preview
  - site/prepare
  - site/README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: README.md
    values:
      description: Introduces Cook, a recipe driven configuration tool that replicates a team's standards to every project, person and coding agent.
  - scope:
      path: cookbook/README.md
    values:
      description: Lists the cookbook artifacts Cook runs today and shows the shape of a recipe and its ingredients.
  - scope:
      path: cookbook/src/agents/README.md
    values:
      description: Describes the agents cookbook artifact, which gives every coding agent in a repository the same guidance, permissions and skills.
  - scope:
      path: cookbook/src/cook/README.md
    values:
      description: Describes the cook cookbook artifact, which configures coding agents for working on the-cook itself.
  - scope:
      path: cookbook/src/docs/README.md
    values:
      description: Describes the docs cookbook artifact, which makes docs/ the one tree that people and coding agents both read.
  - scope:
      path: cookbook/src/docs/principles.md
    values:
      description: Explains the principles behind the docs recipe and the sources behind each choice.
  - scope:
      path: cookbook/src/git/README.md
    values:
      description: Describes the git cookbook artifact, which gives a repository one ignored root for linked worktrees with setup and teardown scripts.
  - scope:
      path: cookbook/src/hello/README.md
    values:
      description: Describes the hello cookbook artifact, a recipe that writes nothing and yields a greeting for tests.
  - scope:
      path: cookbook/src/ralph/README.md
    values:
      description: Describes the ralph cookbook artifact, which sets up ralph-tui to run coding agents unattended in a worktree of their own.
  - scope:
      path: core/README.md
    values:
      description: Describes how the core engine, thecook.cookbook, cooks recipes named by coordinates or by a Groovy path in the kitchen.
  - scope:
      path: infra/README.md
    values:
      description: Describes how infra connects the core engine to the places cookbook releases come from, such as Maven repositories and local paths.
  - scope:
      path: cookbook/src/agents/skills
    values:
      robots: noindex, follow
      sitemap: false
  - scope:
      path: cookbook/src/docs/skills
    values:
      robots: noindex, follow
      sitemap: false
