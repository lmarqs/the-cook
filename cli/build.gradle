plugins {
  id 'thecook.module'
  id 'application'
}
dependencies {
  implementation project(':core')
  implementation project(':infra')
  implementation 'info.picocli:picocli:4.7.7'
}
application {
  applicationName = 'cook'
  mainClass = 'thecook.cli.run.Main'
}
// The version `cook --version` prints, written into the CLI when it is built.
tasks.named('processResources') {
  def cookVersion = version
  inputs.property('version', cookVersion)
  filesMatching('thecook/cli/terminal/version.txt') { expand(version: cookVersion) }
}
tasks.named('test') {
  exclude '**/JpackageTest*'
  inputs.file('src/wrapper/cook')
  systemProperty 'cook.wrapper', file('src/wrapper/cook').absolutePath
  systemProperty 'cook.version', version
  // The cookbook README's rendered help is checked against the help of the repository's own cookbook.
  inputs.files(fileTree('../cookbook') { exclude 'build/**', '.gradle/**', 'test/**' })
  systemProperty 'cook.repository', file('..').absolutePath
}

apply from: 'gradle/jpackage.gradle'
