plugins {
  id 'groovy'
  id 'application'
}
group = 'io.github.lmarqs'
version = findProperty('releaseVersion') ?: '0.0.0'
repositories { mavenCentral() }
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}
dependencies {
  implementation "io.github.lmarqs:the-cook-core:${version}"
  implementation "io.github.lmarqs:the-cook-infra:${version}"
  implementation 'info.picocli:picocli:4.7.7'
  testImplementation 'junit:junit:4.13.2'
}
application {
  applicationName = 'cook'
  mainClass = 'thecook.cli.run.Main'
}
tasks.named('test') {
  exclude '**/JpackageTest*'
  inputs.file('src/wrapper/cook')
  systemProperty 'cook.wrapper', file('src/wrapper/cook').absolutePath
  useJUnit(); testLogging {
    events 'failed'
  }
}

apply from: 'gradle/jpackage.gradle'
