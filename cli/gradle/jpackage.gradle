// Package the same classpath as installDist, using the project's Java toolchain.
def packagingJava = javaToolchains.launcherFor {
  languageVersion = JavaLanguageVersion.of(17)
}
def windows = System.getProperty('os.name').startsWith('Windows')
def mac = System.getProperty('os.name').startsWith('Mac')
def packageInput = layout.buildDirectory.dir('jpackage-input')
def packageOutput = layout.buildDirectory.dir('jpackage')
def imageName = application.applicationName + (mac ? '.app' : '')
def launcher = application.applicationName
def launcherPath = mac ? "Contents/MacOS/${launcher}" : (windows ? "${launcher}.exe" : "bin/${launcher}")
def packagedLauncher = packageOutput.map { it.file("${imageName}/${launcherPath}") }

tasks.register('jpackageInput', Sync) {
  from(tasks.named('jar'))
  from(configurations.runtimeClasspath)
  into(packageInput)
}

tasks.register('jpackage', Exec) {
  group = 'distribution'
  description = 'Build a native app image with a bundled Java runtime for this OS and architecture.'
  dependsOn 'jpackageInput'
  inputs.dir(packageInput)
  inputs.property('applicationVersion', project.version.toString())
  inputs.property('mainClass', application.mainClass)
  inputs.property('applicationName', application.applicationName)
  inputs.property('javaRuntime', packagingJava.map { it.metadata.javaRuntimeVersion })
  inputs.property('platform', System.getProperty('os.name') + '/' + System.getProperty('os.arch'))
  outputs.dir(packageOutput)
  doFirst {
    // jpackage requires a fresh destination when regenerating an image.
    delete(packageOutput)
    commandLine packagingJava.get().metadata.installationPath.file('bin/jpackage' + (windows ? '.exe' : '')).asFile,
        '--type', 'app-image',
        '--name', application.applicationName,
        '--input', packageInput.get().asFile,
        '--dest', packageOutput.get().asFile,
        '--main-jar', tasks.named('jar').get().archiveFileName.get(),
        '--main-class', application.mainClass.get()

    // A macOS bundle refuses a version whose first number is 0, so a development build keeps jpackage's default.
    if (!(mac && project.version.toString().startsWith('0.'))) {
      args '--app-version', project.version.toString()
    }

    if (windows) {
      args '--win-console'
    }
  }
}

// The release names each image by the system and architecture the wrapper reads from `uname -s` and `uname -m`.
def architecture = [amd64: 'x64', x86_64: 'x64', aarch64: 'arm64'][System.getProperty('os.arch')]
def archivePlatform = windows ? null : (mac ? (architecture == 'arm64' ? 'macos-arm64' : null) :
    (architecture ? "linux-${architecture}" : null))
def packageArchive = tasks.register('jpackageArchive', Tar) {
  group = 'distribution'
  description = 'Archive the app image as the-cook-<version>-<os>-<arch>.tar.gz, with its sha256 beside it.'
  dependsOn 'jpackage'
  archiveFileName = "the-cook-${project.version}-${archivePlatform}.tar.gz"
  destinationDirectory = layout.buildDirectory.dir('distributions')
  compression = Compression.GZIP
  preserveFileTimestamps = false
  reproducibleFileOrder = true
  // The launcher and the bundled runtime's helpers must stay executable.
  useFileSystemPermissions()
  from(packageOutput) { include "${imageName}/**" }
  def checksum = destinationDirectory.file(archiveFileName.map { "${it}.sha256" })
  outputs.file(checksum)
  doFirst {
    if (!archivePlatform) {
      throw new GradleException('jpackageArchive packages Linux x64 and arm64 and macOS arm64 images, not ' +
      "${System.getProperty('os.name')} ${System.getProperty('os.arch')}")
    }
  }
  doLast {
    def archive = archiveFile.get().asFile
    def sha256 = java.security.MessageDigest.getInstance('SHA-256')
    archive.eachByte(1 << 16) { byte[] buffer, int length -> sha256.update(buffer, 0, length) }
    checksum.get().asFile.text = "${sha256.digest().encodeHex()}  ${archive.name}\n"
  }
}

tasks.register('jpackageTest', Test) {
  group = 'verification'
  description = 'Exercise the native launcher without Java or Gradle on PATH.'
  dependsOn 'jpackage'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/JpackageTest*'
  useJUnit()
  inputs.dir(packageOutput)
  systemProperty 'cook.packagedLauncher', packagedLauncher.get().asFile.absolutePath
  systemProperty 'cook.version', version

  if (archivePlatform) {
    inputs.file(packageArchive.flatMap { it.archiveFile })
    systemProperty 'cook.packageArchive', packageArchive.get().archiveFile.get().asFile.absolutePath
    systemProperty 'cook.packageArchiveLauncher', "${imageName}/${launcherPath}"
  }
}
