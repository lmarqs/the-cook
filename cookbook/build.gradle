plugins {
  id 'groovy'
  id 'maven-publish'
}

description = 'Recipes and models for the-cook, a recipe driven configuration tool'

// cookbook.toml names the group, which cooking a source directory reads too.
group = (file('cookbook.toml').text =~ /(?m)^group\s*=\s*"([^"]+)"/)[0][1]
version = findProperty('releaseVersion') ?: '0.0.0'

repositories {
  mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
  test {
    groovy.srcDirs = ['test']
    resources {
      srcDirs = ['test']
      exclude '**/*.groovy'
    }
  }
}

dependencies {
  testImplementation 'io.github.lmarqs:the-cook-core'
  testImplementation testFixtures('io.github.lmarqs:the-cook-core')
  testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
  useJUnit()
  systemProperty 'cook.cookbook', file('src').absolutePath
  // The tests cook the recipes and read their files, so a change to any of them must rerun the tests.
  inputs.files(fileTree('src'))
      .withPathSensitivity(PathSensitivity.RELATIVE)
      .withPropertyName('cookbook')
  testLogging { events 'failed' }
}

// The tests are the build's only classes; the artifacts are packaged below.
tasks.named('jar') { enabled = false }

// Each directory under src/ is one artifact: a jar of its files under its package path, <group>/<artifact>/, which the
// engine compiles when one of its recipes is cooked.
def packagePath = project.group.toString().replace('.', '/')
def artifacts = file('src')
    .listFiles()
    .findAll { it.isDirectory() && !it.name.startsWith('.') }
    *.name
    .sort()

artifacts.each { artifact ->
  def jar = tasks.register("${artifact}Jar", Jar) {
    group = 'build'
    description = "Package the ${artifact} artifact"
    archiveBaseName = artifact
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(file("src/${artifact}")) { into("${packagePath}/${artifact}") }
  }
  tasks.named('assemble') { dependsOn jar }
  publishing.publications.create(artifact, MavenPublication) {
    artifactId = artifact
    it.artifact(jar)
  }
}

apply from: '../gradle/central.gradle'

// Maven Central takes each published artifact with a sources and a javadoc jar. Its jar holds only sources, so the
// sources jar repeats it, and the javadoc jar holds its README.
['agents', 'git', 'beads', 'ralph'].each { artifact ->
  def sources = tasks.register("${artifact}SourcesJar", Jar) {
    archiveBaseName = artifact
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(file("src/${artifact}")) { into("${packagePath}/${artifact}") }
  }
  def javadoc = tasks.register("${artifact}JavadocJar", Jar) {
    archiveBaseName = artifact
    archiveClassifier = 'javadoc'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(file("src/${artifact}/README.md"))
  }

  publishing.publications.named(artifact, MavenPublication) {
    it.artifact(sources)
    it.artifact(javadoc)
  }
}
