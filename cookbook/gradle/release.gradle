// Of the artifacts under src/, these are the ones released: each is a jar and its sha256 on a GitHub release.
def released = ['agents', 'beads', 'docs', 'git', 'hello', 'ralph']
def packagePath = project.group.toString().replace('.', '/')
def v = project.version.toString()
def releaseAssetsDir = layout.buildDirectory.dir('release-assets')

// The sha256 file holds the lowercase hex digest alone, so a client compares it with the digest it computes.
def sha256Hex = { File file ->
  def digest = java.security.MessageDigest.getInstance('SHA-256')
  file.withInputStream { stream ->
    byte[] buffer = new byte[8192]
    int read

    while ((read = stream.read(buffer)) != -1) {
      digest.update(buffer, 0, read)
    }
  }
  def bytes = digest.digest()
  bytes.collect { String.format('%02x', it) }.join()
}

def releaseAssets = tasks.register('releaseAssets', Sync) {
  group = 'distribution'
  description = 'Collect the released jars, each with its sha256, as the GitHub release assets.'
  def jars = released.collect { tasks.named("${it}Jar", Jar) }
  def outputDir = releaseAssetsDir
  inputs.property('released', released)
  into(outputDir)
  jars.each { jar -> from(jar.flatMap { it.archiveFile }) }
  doLast {
    def written = outputDir.get().asFile.listFiles()
    written.findAll { it.name.endsWith('.jar') }.each {
      new File(it.parentFile, "${it.name}.sha256").text = sha256Hex(it)
    }
  }
}

tasks.register('releaseAssetsTest') {
  group = 'verification'
  description = 'Check that the release assets hold exactly the released jars, each with a matching sha256.'
  def assets = releaseAssets.map { releaseAssetsDir.get() }
  inputs.dir(assets)
  doLast {
    def dir = assets.get().asFile
    def jars = released.collect { "${it}-${v}.jar".toString() }
    def expected = (jars + jars.collect { "${it}.sha256".toString() }).sort()
    def files = dir.list() as List
    files.sort()

    if (files != expected) {
      throw new GradleException("The release assets hold ${files}; expected ${expected}")
    }

    jars.each { jar ->
      def digest = new File(dir, "${jar}.sha256").text
      def actual = sha256Hex(new File(dir, jar))

      if (digest != actual) {
        throw new GradleException("${jar}.sha256 holds ${digest}; the jar's digest is ${actual}")
      }
    }

    def beadsFiles = [
      'README.md',
      'BeadsTracker.groovy',
      'BeadsViewer.groovy',
      'tracker.groovy',
      'viewer.groovy',
      'instructions/team.md',
      'instructions/clone.md',
      'instructions/viewer.md'
    ]
    .collect { "${packagePath}/beads/${it}".toString() }
    def contents = new java.util.zip.ZipFile(new File(dir, "beads-${v}.jar")).withCloseable { zip ->
      zip.entries().findAll { !it.directory }*.name
    }

    if (!contents.containsAll(beadsFiles)) {
      throw new GradleException("beads-${v}.jar holds ${contents}; expected the Beads payload ${beadsFiles}")
    }
  }
}

tasks.named('check') { dependsOn 'releaseAssetsTest' }
