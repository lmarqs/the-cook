// External URLs are not fetched, so the check stays offline and deterministic.
plugins {
  id 'base'
}

abstract class DocsLinkCheck extends DefaultTask {
  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  abstract ConfigurableFileCollection getMarkdown()

  @Internal
  abstract DirectoryProperty getRoot()

  @OutputFile
  abstract RegularFileProperty getReport()

  @TaskAction
  void check() {
    File root = this.root.get().asFile
    List<String> broken = []
    int total = 0
    Map<File, Set<String>> anchors = [:]
    markdown.files.sort().each { File file ->
      List<String> lines = proseLines(file)
      lines.eachWithIndex { String line, int index ->
        (line =~ /\]\(<?([^)\s>]+)>?(?:\s+"[^"]*")?\)/).each { match ->
          String url = match[1]

          if (url ==~ /^[a-zA-Z][a-zA-Z0-9+.-]*:.*/) {
            return
          }

          total++
          String path = url.contains('#') ? url.substring(0, url.indexOf('#')) : url
          String fragment = url.contains('#') ? url.substring(url.indexOf('#') + 1) : ''
          File target = path ? new File(file.parentFile, URLDecoder.decode(path, 'UTF-8')).canonicalFile : file
          String problem = null

          if (!target.exists()) {
            problem = 'missing file'
          }
          else if (fragment && target.name.endsWith('.md')) {
            Set<String> known = anchors.computeIfAbsent(target) { headingAnchors(it) }

            if (!(fragment in known)) {
              problem = 'missing anchor'
            }
          }

          if (problem) {
            broken << "${root.toPath().relativize(file.toPath())}:${index + 1}: ${problem}: ${url}".toString()
          }
        }
      }
    }
    report.get().asFile.text = "links ${total}, broken ${broken.size()}\n" + broken.collect { it + '\n' }.join('')

    if (broken) {
      throw new GradleException("Broken documentation links:\n" + broken.join('\n'))
    }

    logger.lifecycle("Documentation links: ${total} checked, none broken")
  }

  // Returns the file's lines with fenced code blocks blanked, so line numbers stay accurate.
  static List<String> proseLines(File file) {
    String fence = null
    file.readLines('UTF-8').collect { String line ->
      def marker = line =~ /^\s{0,3}(`{3,}|~{3,})/

      if (marker.find()) {
        String found = marker.group(1)

        if (fence == null) {
          fence = found
          return ''
        }

        if (found[0] == fence[0] && found.length() >= fence.length() && line.trim() == found) {
          fence = null
          return ''
        }
      }

      fence == null ? line : ''
    }
  }

  // Mirrors GitHub's heading anchors: lowercase, punctuation removed, spaces as hyphens, "-N" for repeats.
  static Set<String> headingAnchors(File file) {
    Map<String, Integer> seen = [:]
    Set<String> result = [] as Set
    proseLines(file).each { String line ->
      def heading = line =~ /^#{1,6}\s+(.*?)\s*#*\s*$/

      if (heading.find()) {
        String text = heading.group(1).replaceAll(/\[([^\]]*)\]\([^)]*\)/, '$1')
        String slug = text.toLowerCase(Locale.ROOT)
            .replaceAll(/[^\p{L}\p{N}\s_-]/, '')
            .replaceAll(/\s/, '-')
        int count = seen.getOrDefault(slug, 0)
        seen[slug] = count + 1
        result << (count == 0 ? slug : "${slug}-${count}".toString())
      }
    }
    result
  }
}

// A reader picks a page from its front matter, unopened, so every page describes itself there; the rule is the one
// docs/ux/messages-and-docs.md gives.
abstract class DocsFrontMatterCheck extends DefaultTask {
  static final Map<String, Integer> LIMITS = [description: 160, audience: 100]
  static final List<String> KEYS = ['description', 'audience', 'keywords']
  // GitHub shows front matter as a table, so a value is plain text that YAML reads as one plain string.
  static final String PLAIN = /\A[\p{L}\p{N}][^`"]*\z/
  static final String ITEM = /\A[\p{L}\p{N}][^`"\[\]{},]*\z/

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  abstract ConfigurableFileCollection getMarkdown()

  @Internal
  abstract DirectoryProperty getRoot()

  @OutputFile
  abstract RegularFileProperty getReport()

  @TaskAction
  void check() {
    File root = this.root.get().asFile
    List<String> wrong = []
    Map<String, String> described = [:]
    int total = 0
    markdown.files.sort().each { File file ->
      String path = root.toPath().relativize(file.toPath())
      total++
      Map<String, String> fields = [:]
      String problem = frontMatterProblem(file.readLines('UTF-8'), fields)

      if (problem) {
        wrong << "${path}: ${problem}".toString()
      }
      else if (described.containsKey(fields.description)) {
        wrong << "${path}: its description repeats ${described[fields.description]}'s".toString()
      }
      else {
        described[fields.description] = path
      }
    }
    report.get().asFile.text = "pages ${total}, wrong ${wrong.size()}\n" + wrong.collect { it + '\n' }.join('')

    if (wrong) {
      throw new GradleException("Documentation front matter:\n" + wrong.join('\n'))
    }

    logger.lifecycle("Documentation front matter: ${total} checked, none wrong")
  }

  // Fills fields with the page's keys and returns what is wrong, or null.
  static String frontMatterProblem(List<String> lines, Map<String, String> fields) {
    if (!lines || lines[0] != '---') {
      return 'the first line does not open its front matter, ---'
    }

    int close = lines.drop(1).findIndexOf { it == '---' } + 1

    if (close == 0) {
      return 'its front matter is not closed by ---'
    }

    for (String line : lines.subList(1, close)) {
      def field = line =~ /\A([a-z]+): (.*)\z/

      if (!field.find()) {
        return "the front matter line is not a key and its value: ${line}"
      }

      String key = field.group(1)
      String value = field.group(2)

      if (!(key in KEYS)) {
        return "the front matter holds ${key}, which is not one of ${KEYS.join(', ')}"
      }

      if (fields.containsKey(key)) {
        return "the front matter holds ${key} twice"
      }

      String valueProblem = key == 'keywords' ? keywordsProblem(value) : plainProblem(key, value)

      if (valueProblem) {
        return valueProblem
      }

      fields[key] = value
    }

    String missing = LIMITS.keySet().find { !fields.containsKey(it) }

    if (missing) {
      return "the front matter lacks ${missing}"
    }

    if (close + 1 >= lines.size() || !lines[close + 1].startsWith('# ')) {
      return 'the front matter is not followed by the title'
    }

    null
  }

  static String plainProblem(String key, String value) {
    if (!plain(value, PLAIN)) {
      return "${key} is not plain text: ${value}"
    }

    if (value.length() > LIMITS[key]) {
      return "${key} has ${value.length()} characters, more than ${LIMITS[key]}"
    }

    null
  }

  // YAML reads ': ' and ' #' as syntax inside an unquoted value.
  static boolean plain(String value, String pattern) {
    value ==~ pattern && !value.contains(': ') && !value.contains(' #')
  }

  static String keywordsProblem(String value) {
    def list = value =~ /\A\[(.+)\]\z/

    if (!list.find()) {
      return "keywords is not a list, as [one term, another]: ${value}"
    }

    List<String> terms = list.group(1).split(', ')

    if (terms.any { !plain(it, ITEM) }) {
      return "keywords is not a list of plain terms, as [one term, another]: ${value}"
    }

    null
  }
}

tasks.register('linkCheck', DocsLinkCheck) {
  group = 'verification'
  description = 'Checks relative links and heading anchors in the documentation.'
  root = layout.projectDirectory
  markdown.from(fileTree(layout.projectDirectory) {
    include '**/*.md'
    exclude 'build/**', '.gradle/**'
  })
  report = layout.buildDirectory.file('reports/links.txt')
}

tasks.register('frontMatterCheck', DocsFrontMatterCheck) {
  group = 'verification'
  description = 'Checks that each documentation page opens with front matter that describes it, then its title.'
  root = layout.projectDirectory
  markdown.from(fileTree(layout.projectDirectory) {
    include '**/*.md'
    exclude 'build/**', '.gradle/**'
  })
  report = layout.buildDirectory.file('reports/front-matter.txt')
}

tasks.named('check') {
  dependsOn 'linkCheck', 'frontMatterCheck'
}
