plugins {
  id 'com.diffplug.spotless' version '8.10.4'
}

repositories {
  mavenCentral()
}

configurations {
  codenarc {
    attributes.attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
  }
}

dependencies {
  codenarc 'org.codenarc:CodeNarc:3.7.0-groovy-4.0'
}

spotless {
  def generated = ['**/build/**', '**/.gradle/**', '.worktrees/**']
  // download.eclipse.org can be shut down for days; an Eclipse Foundation mirror serves the same update sites.
  // Spotless refuses an update site with no entry, so the Groovy-Eclipse site maps to itself.
  def groovyEclipse = 'https://groovy.jfrog.io/artifactory/plugins-release/'
  def eclipseMirror = ['https://download.eclipse.org/': 'https://ftp.fau.de/eclipse/', (groovyEclipse): groovyEclipse]
  groovy {
    target '**/*.groovy'
    // The formatter cannot parse the quoted `default` member that recipes write as `@param(default = ...)`.
    targetExclude generated +
        ['core/src/main/groovy/thecook/cookbook/api/recipe/RecipeAnnotations.groovy']
    greclipse()
        .configFile('gradle/spotless/greclipse.properties')
        .withP2Mirrors(eclipseMirror)
  }
  groovyGradle {
    target '**/*.gradle'
    targetExclude generated
    greclipse()
        .configFile('gradle/spotless/greclipse.properties')
        .withP2Mirrors(eclipseMirror)
  }
  format 'misc', {
    target '**/*.md', '**/*.properties', '**/*.sh', '**/*.toml', '.gitignore'
    targetExclude generated + ['gradle/wrapper/**']
    trimTrailingWhitespace()
    endWithNewline()
  }
}

def codenarcArgs = { String report ->
  [
    '-basedir=.',
    '-includes=**/*.groovy,**/*.gradle',
    '-excludes=**/build/**,**/.gradle/**,.worktrees/**',
    '-rulesetfiles=file:' + file('gradle/lint/codenarc.groovy'),
    '-failOnError=true',
    report,
  ]
}

tasks.register('codenarc', JavaExec) {
  description = 'Lints Groovy and Gradle files with the rulesets in gradle/lint/codenarc.groovy.'
  group = 'verification'
  classpath = configurations.codenarc
  mainClass = 'org.codenarc.CodeNarc'
  args codenarcArgs('-report=console')
  args '-maxPriority1Violations=0', '-maxPriority2Violations=0', '-maxPriority3Violations=0'
}

// The Maven Central Portal takes one zip of a Maven-layout tree for a release. The published artifacts are the cookbook
// artifacts `agents`, `git`, `beads` and `ralph`.
def releaseVersion = findProperty('releaseVersion') ?: '0.0.0'
def cookbookArtifacts = ['agents', 'git', 'beads', 'ralph']
def centralBundle = tasks.register('centralBundle', Zip) {
  group = 'publishing'
  description = 'Bundle the cookbook artifacts, with their checksums, for the Central Portal.'
  cookbookArtifacts.each {
    dependsOn gradle.includedBuild('cookbook').task(":publish${it.capitalize()}PublicationToCentralRepository")
  }
  from('cookbook/build/central')
  exclude '**/maven-metadata.xml*'
  includeEmptyDirs = false
  archiveFileName = 'central-bundle.zip'
  destinationDirectory = layout.buildDirectory.dir('central')
}

tasks.register('centralBundleTest') {
  group = 'verification'
  description = 'Check that the Central bundle holds exactly the published artifacts, each with its checksums.'
  def bundle = centralBundle.flatMap { it.archiveFile }
  inputs.file(bundle)
  doLast {
    def entries = new java.util.zip.ZipFile(bundle.get().asFile).withCloseable { zip -> zip.entries()*.name }
    def v = releaseVersion
    def cookbook = cookbookArtifacts.collect { "io/github/lmarqs/cookbook/${it}/${v}/${it}-${v}" }
    def expected = ['', '-sources', '-javadoc'].collectMany { suffix ->
      cookbook.collect { "${it}${suffix}.jar" }
    } + cookbook.collect { "${it}.pom" }
    def files = entries.findAll { !it.endsWith('/') && !(it ==~ /.*\.(md5|sha1|sha256|sha512|asc)/) }
    def missing = files.findAll { !(entries.contains(it + '.md5') && entries.contains(it + '.sha1')) }

    if (files.sort() != expected*.toString().sort() || missing) {
      throw new GradleException("The Central bundle holds ${files}, with ${missing} missing a checksum; " +
      "expected ${expected}")
    }
  }
}

tasks.named('check') {
  dependsOn 'codenarc', 'centralBundleTest'
  dependsOn gradle.includedBuild('core').task(':check'), gradle.includedBuild('infra').task(':check')
  dependsOn gradle.includedBuild('cli').task(':check')
  dependsOn gradle.includedBuild('docs').task(':check')
  dependsOn gradle.includedBuild('cookbook').task(':check')
}

tasks.register('cliBuild') { dependsOn gradle.includedBuild('cli').task(':installDist') }

tasks.register('jpackage') {
  group = 'distribution'
  description = 'Build the CLI with a bundled Java runtime for this platform.'
  dependsOn gradle.includedBuild('cli').task(':jpackage')
}

tasks.register('jpackageArchive') {
  group = 'distribution'
  description = 'Archive the Linux app image for this architecture, with its sha256.'
  dependsOn gradle.includedBuild('cli').task(':jpackageArchive')
}

tasks.register('jpackageTest') {
  group = 'verification'
  description = 'Build and smoke-test the packaged CLI.'
  dependsOn gradle.includedBuild('cli').task(':jpackageTest')
}
