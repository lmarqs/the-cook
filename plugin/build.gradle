plugins {
  id 'groovy'
  id 'java-gradle-plugin'
  id 'maven-publish'
}

group = 'io.github.lmarqs'
version = findProperty('releaseVersion') ?: '0.0.0'
description = 'Gradle plugin that packages a cookbook for the-cook as Maven artifacts'

repositories {
  mavenCentral()
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(17)
  withSourcesJar()
  withJavadocJar()
}

dependencies {
  implementation 'org.tomlj:tomlj:1.0.0'
  testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
  plugins {
    cookbook { id = 'io.github.lmarqs.cookbook'; implementationClass = 'thecook.gradle.CookbookPlugin' }
  }
}

apply from: '../gradle/central.gradle'

// A Maven-local layout inside the build, so the tests resolve the published plugin without touching ~/.m2.
def testMavenLocal = layout.buildDirectory.dir('maven-local')

publishing {
  repositories {
    maven { name = 'testMavenLocal'; url = testMavenLocal }
  }
}

tasks.named('test') {
  useJUnit()
  dependsOn 'publishAllPublicationsToTestMavenLocalRepository'
  systemProperty 'thecook.mavenLocal', testMavenLocal.get().asFile.path
  systemProperty 'thecook.pluginVersion', version
}
