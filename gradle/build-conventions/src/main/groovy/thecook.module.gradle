// The setup that the core, infra and cli projects share.
plugins {
  id 'groovy'
  id 'thecook.lint'
}

group = 'io.github.lmarqs'
version = findProperty('releaseVersion') ?: '0.0.0'

base {
  archivesName = "the-cook-${project.name}"
}

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
  useJUnit()
  testLogging { events 'failed' }
}
